<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Decor PDF Template</title>
    <style>
        @page {
            margin: 20mm;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
        }
        
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        p {
            margin: 5px 0;
            color: #555;
        }
        
        .item {
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 10px;
            page-break-inside: avoid;
        }
    </style>
</head>
<body>
    {{#each pdfData}}
        <div class="item">
            <h1>{{title}}</h1>
            <p>Author: {{author}}</p>
        </div>
    {{/each}}
</body>
</html>
